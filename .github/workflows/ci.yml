name: Verify secure notes
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: peacock
          POSTGRES_PASSWORD: ci-disposable-password
          POSTGRES_DB: peacock_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U peacock -d peacock_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://peacock:ci-disposable-password@localhost:5432/peacock_test?schema=public
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: disposable-ci-secret-not-for-production-2026
      TRUSTED_PROXY: none
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run db:migrate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run test:concurrency
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm start > /tmp/quietnote-server.log 2>&1 &
      - run: node scripts/wait-for-app.mjs
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-evidence
          path: |
            playwright-report/
            test-results/
